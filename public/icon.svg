<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#13131c"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </linearGradient>
    <radialGradient id="flame" cx="0.5" cy="0.6" r="0.55">
      <stop offset="0%" stop-color="#fff8d6"/>
      <stop offset="25%" stop-color="#ffd166"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0.85"/>
    </radialGradient>
    <linearGradient id="wax" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a26"/>
      <stop offset="100%" stop-color="#0f0f18"/>
    </linearGradient>
  </defs>

  <!-- Background tile -->
  <rect x="0" y="0" width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Soft halo behind candles -->
  <ellipse cx="256" cy="200" rx="180" ry="60" fill="#f59e0b" opacity="0.08"/>

  <!-- Left candle -->
  <g>
    <line x1="180" y1="170" x2="180" y2="186" stroke="#1c1917" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="180" cy="148" rx="22" ry="42" fill="url(#flame)"/>
    <ellipse cx="180" cy="156" rx="11" ry="24" fill="#fff8d6"/>
    <rect x="160" y="186" width="40" height="190" rx="6" fill="url(#wax)" stroke="#a16207" stroke-width="1"/>
  </g>

  <!-- Right candle -->
  <g>
    <line x1="332" y1="170" x2="332" y2="186" stroke="#1c1917" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="332" cy="148" rx="22" ry="42" fill="url(#flame)"/>
    <ellipse cx="332" cy="156" rx="11" ry="24" fill="#fff8d6"/>
    <rect x="312" y="186" width="40" height="190" rx="6" fill="url(#wax)" stroke="#a16207" stroke-width="1"/>
  </g>

  <!-- Scoreboard between candles -->
  <g>
    <rect x="200" y="396" width="112" height="56" rx="10" fill="url(#screen)" stroke="#3b82f6" stroke-width="2"/>
    <text x="241" y="440" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="34" font-weight="700" fill="#22c55e">7</text>
    <text x="256" y="438" text-anchor="middle" font-family="ui-monospace, monospace" font-size="22" font-weight="700" fill="#52525b">–</text>
    <text x="271" y="440" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="34" font-weight="700" fill="#e4e4e7">3</text>
  </g>
</svg>
