<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#13131c"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </linearGradient>
    <radialGradient id="flame" cx="0.5" cy="0.6" r="0.55">
      <stop offset="0%" stop-color="#fff8d6"/>
      <stop offset="25%" stop-color="#ffd166"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0.85"/>
    </radialGradient>
    <linearGradient id="wax" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <radialGradient id="football" cx="0.5" cy="0.35" r="0.65">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </radialGradient>
    <linearGradient id="shaft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a16207"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <!-- Background tile -->
  <rect x="0" y="0" width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Soft halo behind candles -->
  <ellipse cx="256" cy="160" rx="200" ry="70" fill="#f59e0b" opacity="0.08"/>

  <!-- Left candle -->
  <g>
    <line x1="170" y1="128" x2="170" y2="146" stroke="#1c1917" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="170" cy="106" rx="22" ry="42" fill="url(#flame)"/>
    <ellipse cx="170" cy="114" rx="11" ry="24" fill="#fff8d6"/>
    <rect x="150" y="146" width="40" height="172" rx="6" fill="url(#wax)" stroke="#a16207" stroke-width="1"/>
  </g>

  <!-- Right candle -->
  <g>
    <line x1="342" y1="128" x2="342" y2="146" stroke="#1c1917" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="342" cy="106" rx="22" ry="42" fill="url(#flame)"/>
    <ellipse cx="342" cy="114" rx="11" ry="24" fill="#fff8d6"/>
    <rect x="322" y="146" width="40" height="172" rx="6" fill="url(#wax)" stroke="#a16207" stroke-width="1"/>
  </g>

  <!-- Hockey stick: laid diagonally across the lower portion, blade lower-left -->
  <g transform="rotate(-12 256 415)">
    <!-- Shaft -->
    <rect x="100" y="410" width="320" height="14" rx="4" fill="url(#shaft)" stroke="#451a03" stroke-width="1.5"/>
    <!-- Grip tape near right end -->
    <rect x="370" y="407" width="50" height="20" rx="2" fill="#18181b"/>
    <!-- Subtle tape stripes on grip -->
    <line x1="380" y1="407" x2="380" y2="427" stroke="#27272a" stroke-width="1"/>
    <line x1="395" y1="407" x2="395" y2="427" stroke="#27272a" stroke-width="1"/>
    <line x1="410" y1="407" x2="410" y2="427" stroke="#27272a" stroke-width="1"/>
    <!-- Blade at left end, angled -->
    <g transform="rotate(38 100 417)">
      <path d="M 35 410 L 100 410 L 100 432 L 35 442 Z" fill="#27272a" stroke="#000" stroke-width="1.5"/>
      <!-- Blade tape strip -->
      <rect x="40" y="424" width="58" height="4" fill="#3f3f46" opacity="0.6"/>
    </g>
  </g>

  <!-- Football: tucked into lower-right, tilted -->
  <g transform="translate(360 388) rotate(-25)">
    <ellipse cx="0" cy="0" rx="56" ry="32" fill="url(#football)" stroke="#451a03" stroke-width="2"/>
    <!-- White stripe near tip -->
    <path d="M -50 -4 Q -46 0 -50 4" stroke="#fef3c7" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 50 -4 Q 46 0 50 4" stroke="#fef3c7" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Center lace line -->
    <line x1="-18" y1="0" x2="18" y2="0" stroke="#fef3c7" stroke-width="3" stroke-linecap="round"/>
    <!-- Cross laces -->
    <line x1="-12" y1="-6" x2="-12" y2="6" stroke="#fef3c7" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-4" y1="-7" x2="-4" y2="7" stroke="#fef3c7" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="4" y1="-7" x2="4" y2="7" stroke="#fef3c7" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="12" y1="-6" x2="12" y2="6" stroke="#fef3c7" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
