<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#13131c"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </linearGradient>
    <radialGradient id="flame" cx="0.5" cy="0.6" r="0.55">
      <stop offset="0%" stop-color="#fff8d6"/>
      <stop offset="25%" stop-color="#ffd166"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0.85"/>
    </radialGradient>
    <linearGradient id="wax" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <radialGradient id="football" cx="0.5" cy="0.35" r="0.65">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </radialGradient>
    <radialGradient id="basketball" cx="0.35" cy="0.35" r="0.75">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="60%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </radialGradient>
  </defs>

  <!-- Background tile -->
  <rect x="0" y="0" width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Soft halo behind the candles -->
  <ellipse cx="256" cy="130" rx="130" ry="55" fill="#f59e0b" opacity="0.1"/>

  <!-- Left candle (smaller, closer to center) -->
  <g>
    <line x1="240" y1="98" x2="240" y2="114" stroke="#1c1917" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="240" cy="80" rx="16" ry="32" fill="url(#flame)"/>
    <ellipse cx="240" cy="86" rx="8" ry="18" fill="#fff8d6"/>
    <rect x="226" y="114" width="28" height="138" rx="5" fill="url(#wax)" stroke="#a16207" stroke-width="1"/>
  </g>

  <!-- Right candle -->
  <g>
    <line x1="272" y1="98" x2="272" y2="114" stroke="#1c1917" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="272" cy="80" rx="16" ry="32" fill="url(#flame)"/>
    <ellipse cx="272" cy="86" rx="8" ry="18" fill="#fff8d6"/>
    <rect x="258" y="114" width="28" height="138" rx="5" fill="url(#wax)" stroke="#a16207" stroke-width="1"/>
  </g>

  <!-- Basketball — lower-left -->
  <g transform="translate(150 380)">
    <circle r="78" fill="url(#basketball)" stroke="#5b2c0e" stroke-width="2"/>
    <!-- Equator -->
    <line x1="-78" y1="0" x2="78" y2="0" stroke="#5b2c0e" stroke-width="3" stroke-linecap="round"/>
    <!-- Center vertical seam -->
    <line x1="0" y1="-78" x2="0" y2="78" stroke="#5b2c0e" stroke-width="3" stroke-linecap="round"/>
    <!-- Left bowing seam -->
    <path d="M 0 -78 Q -56 0 0 78" stroke="#5b2c0e" stroke-width="2.5" fill="none"/>
    <!-- Right bowing seam -->
    <path d="M 0 -78 Q 56 0 0 78" stroke="#5b2c0e" stroke-width="2.5" fill="none"/>
    <!-- Highlight shine -->
    <ellipse cx="-25" cy="-30" rx="14" ry="8" fill="#fed7aa" opacity="0.4"/>
  </g>

  <!-- Football — lower-right, tilted -->
  <g transform="translate(372 388) rotate(-22)">
    <ellipse cx="0" cy="0" rx="72" ry="42" fill="url(#football)" stroke="#451a03" stroke-width="2"/>
    <!-- Curved stripes near tips -->
    <path d="M -64 -6 Q -58 0 -64 6" stroke="#fef3c7" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M 64 -6 Q 58 0 64 6" stroke="#fef3c7" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <!-- Center lace line -->
    <line x1="-22" y1="0" x2="22" y2="0" stroke="#fef3c7" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Cross laces -->
    <line x1="-14" y1="-7" x2="-14" y2="7" stroke="#fef3c7" stroke-width="3" stroke-linecap="round"/>
    <line x1="-5" y1="-8" x2="-5" y2="8" stroke="#fef3c7" stroke-width="3" stroke-linecap="round"/>
    <line x1="5" y1="-8" x2="5" y2="8" stroke="#fef3c7" stroke-width="3" stroke-linecap="round"/>
    <line x1="14" y1="-7" x2="14" y2="7" stroke="#fef3c7" stroke-width="3" stroke-linecap="round"/>
    <!-- Subtle highlight -->
    <ellipse cx="-20" cy="-18" rx="16" ry="6" fill="#fed7aa" opacity="0.3"/>
  </g>
</svg>
